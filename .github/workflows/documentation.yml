name: Standalone documentation
on:
  pull_request:
    paths:
      - '.github/README.md'
      - '.github/CI.md'
      - 'CURRENT_REPRODUCTION.md'
      - 'graph_synthesis/DATASETS.md'
      - '.github/check_documentation.py'
      - '.github/test_documentation.py'
      - '.github/workflows/documentation.yml'
  push:
    branches: [main]
    paths:
      - '.github/README.md'
      - '.github/CI.md'
      - 'CURRENT_REPRODUCTION.md'
      - 'graph_synthesis/DATASETS.md'
      - '.github/check_documentation.py'
      - '.github/test_documentation.py'
      - '.github/workflows/documentation.yml'
permissions:
  contents: read
concurrency:
  group: standalone-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test link checking and the archive exclusion boundary
        run: python -B -m unittest discover -s .github -p test_documentation.py -v
      - name: Check local documentation links
        run: python -B .github/check_documentation.py
